<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Website Audit & Crawler | SEO, AI & Security | Dominion Fortress</title><meta name="description" content="Run a public website audit for SEO, technical quality, structured data, headings, links, image accessibility and security signals."><meta name="robots" content="index,follow"><link rel="canonical" href="https://dominion-fortress.com/tools/website-audit/"><link rel="icon" href="/Dominion%20Fortress%20Logo.jpg"><style>body{margin:0;background:#080d14;color:#f8fafc;font:16px/1.65 system-ui;max-width:900px;margin:auto;padding:50px 22px}a{color:#38bdf8}h1{font-size:clamp(38px,7vw,68px);line-height:1.05}.box{border:1px solid #263449;background:#101925;border-radius:14px;padding:25px;margin-top:28px}input{width:100%;box-sizing:border-box;padding:15px;border-radius:8px;border:1px solid #334155;background:#0b111b;color:white;margin:8px 0 14px}button{padding:14px 20px;border:0;border-radius:8px;background:#0ea5e9;color:white;font-weight:700}.score{font-size:50px;font-weight:800;color:#38bdf8}.finding{padding:12px;border-bottom:1px solid #263449}.muted{color:#9eacc0}</style></head><body><p><a href="/">DOMINION FORTRESS</a> · <a href="/tools/">TOOLS</a></p><h1>Website Audit & Public Crawler</h1><p class="muted">Analyze public HTML pages for practical SEO, AI-search and technical signals. This crawler only requests public HTTP(S) pages and does not attempt exploitation.</p><div class="box"><label for="url">Website URL</label><input id="url" placeholder="https://example.com"><button id="run">Run free audit</button><div id="out"></div></div><script>const out=document.getElementById('out');document.getElementById('run').onclick=async()=>{const url=document.getElementById('url').value.trim();if(!url)return;out.innerHTML='<p class="muted">Crawling public pages…</p>';try{const r=await fetch('https://qowjbytxepdkmatvidcj.supabase.co/functions/v1/website-audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,max_pages:8})});const d=await r.json();if(!r.ok)throw Error(d.error||'Audit failed');const x=d.result;out.innerHTML='<h2>Website score</h2><div class="score">'+x.score+'/100</div><p>'+x.pages_scanned+' public pages scanned.</p>'+x.pages.map(p=>'<div class="finding"><b>'+escapeHtml(p.title||p.url)+'</b><br>H1: '+p.h1_count+' · Words: '+p.word_count+' · Images without alt: '+p.images_without_alt+' · JSON-LD: '+p.jsonld_blocks+' · HSTS: '+(p.headers.hsts?'Yes':'No')+'</div>').join('')+'<p><a href="/get-started/">Want us to fix the findings? Start a project →</a></p>'}catch(e){out.innerHTML='<p>Audit error: '+escapeHtml(e.message)+'</p>'}};function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
