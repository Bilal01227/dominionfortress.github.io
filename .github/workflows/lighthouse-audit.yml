name: Lighthouse performance and accessibility audit
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'assets/**'
      - '.github/workflows/lighthouse-audit.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and read sitemap
        uses: actions/checkout@v4
      - name: Build Lighthouse URL list from every sitemap entry
        id: sitemap
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...xml.matchAll(/<loc>([^<]+)<\\/loc>/g)].map(match => match[1].trim());
          if (!urls.length) throw new Error('No URLs found in sitemap.xml');
          if (new Set(urls).size !== urls.length) throw new Error('Duplicate URLs found in sitemap.xml');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'urls<<SITEMAP_URLS\\n' + urls.join('\\n') + '\\nSITEMAP_URLS\\n');
          console.log('Auditing ' + urls.length + ' sitemap URLs.');
          NODE
      - name: Audit every published sitemap URL
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.sitemap.outputs.urls }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: Publish scores and Core Web Vitals to the workflow summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = '.lighthouseci';
          const rows = [];
          if (fs.existsSync(dir)) {
            for (const file of fs.readdirSync(dir).filter(name => name.endsWith('.json'))) {
              try {
                const data = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
                const report = data.lighthouseResult || data;
                if (!report.categories || !report.audits) continue;
                const score = key => report.categories[key]?.score == null ? '—' : Math.round(report.categories[key].score * 100);
                const metric = id => {
                  const audit = report.audits[id];
                  if (!audit || audit.numericValue == null) return '—';
                  const value = audit.numericValue;
                  if (id === 'largest-contentful-paint' || id === 'first-contentful-paint') return (value / 1000).toFixed(2) + ' s';
                  if (id === 'cumulative-layout-shift') return value.toFixed(3);
                  if (id === 'interaction-to-next-paint') return Math.round(value) + ' ms';
                  return Math.round(value);
                };
                rows.push({
                  url: report.requestedUrl || report.finalDisplayedUrl || file,
                  performance: score('performance'),
                  accessibility: score('accessibility'),
                  bestPractices: score('best-practices'),
                  seo: score('seo'),
                  lcp: metric('largest-contentful-paint'),
                  inp: metric('interaction-to-next-paint'),
                  cls: metric('cumulative-layout-shift'),
                  accessibilityIssues: report.categories.accessibility.auditRefs
                    .filter(ref => report.audits[ref.id] && report.audits[ref.id].score != null && report.audits[ref.id].score < 1)
                    .map(ref => report.audits[ref.id].title)
                });
              } catch {}
            }
          }
          if (!rows.length) throw new Error('No Lighthouse reports were found to summarize.');
          const uniqueRows = [...new Map(rows.map(row => [row.url, row])).values()];
          const lines = [
            '## Lighthouse audit results',
            '',
            '| URL | Performance | Accessibility | Best practices | SEO | LCP | INP* | CLS |',
            '|---|---:|---:|---:|---:|---:|---:|---:|',
            ...uniqueRows.map(r => `| ${r.url} | ${r.performance} | ${r.accessibility} | ${r.bestPractices} | ${r.seo} | ${r.lcp} | ${r.inp} | ${r.cls} |`),
            '',
            '*INP is field data when available; Lighthouse may not provide a lab value for every run.',
            '',
            '### Accessibility opportunities',
            ...uniqueRows.flatMap(r => r.accessibilityIssues.map(issue => `- ${r.url}: ${issue}`)),
          ];
          console.log(lines.join('\\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n') + '\\n');
          NODE
