name: Lighthouse performance and accessibility audit
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'get-started/index.html'
      - 'solutions/security-audit/index.html'
      - 'privacy/index.html'
      - 'assets/**'
      - '.github/workflows/lighthouse-audit.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Audit key customer journeys
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://dominion-fortress.com/
            https://dominion-fortress.com/get-started/
            https://dominion-fortress.com/solutions/security-audit/
            https://dominion-fortress.com/privacy/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false
