name: Install Dominion Fortress sales tracking
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject tracker into homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/sales-machine.js" defer></script>'
          if tag not in s:
              s=s.replace('</head>', f'    {tag}\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected tracker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Install first-party website sales tracking'
          git push