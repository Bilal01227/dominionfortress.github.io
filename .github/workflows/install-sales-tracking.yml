name: Synchronize Dominion Fortress site runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shared asset versions and install opt-in analytics on all pages
        run: |
          python - <<'PY'
          from pathlib import Path
          old_tag = '<script src="/assets/sales-machine.js" defer></script>'
          old_versioned_tag = '<script src="/assets/sales-machine.js?v=20261011" defer></script>'
          old_versioned_tag2 = '<script src="/assets/sales-machine.js?v=20261012" defer></script>'
          tag = '<script src="/assets/sales-machine.js?v=20261013" defer></script>'
          for p in sorted(Path('.').rglob('*.html')):
              if p.name == '404.html' or '.git' in p.parts:
                  continue
              original = p.read_text(encoding='utf-8')
              s = original.replace('contact@dominionfortress.com', 'contact.dominionfortress@gmail.com')
              s = s.replace('df-experience.css?v=20261010', 'df-experience.css?v=20261012')
              s = s.replace('df-experience.css?v=20261011', 'df-experience.css?v=20261013')
              s = s.replace('df-experience.css?v=20261012', 'df-experience.css?v=20261013')
              s = s.replace('df-experience.js?v=20261010', 'df-experience.js?v=20261012')
              s = s.replace('df-experience.js?v=20261011', 'df-experience.js?v=20261013')
              s = s.replace('df-experience.js?v=20261012', 'df-experience.js?v=20261013')
              s = s.replace(old_tag, tag).replace(old_versioned_tag, tag).replace(old_versioned_tag2, tag)
              if tag not in s:
                  s = s.replace('</head>', f'    {tag}\n</head>', 1)
              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Validate synchronized working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('.').rglob('*.html')):
              if p.name == '404.html' or '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              required = [
                  '/assets/sales-machine.js?v=20261013',
                  '/assets/df-experience.css?v=20261013',
                  '/assets/df-experience.js?v=20261013',
              ]
              if any(item not in s for item in required):
                  raise SystemExit(f'Shared runtime version missing in {p}')
          PY
          node --check assets/df-experience.js
          node --check assets/sales-machine.js
          node scripts/validate-site.mjs
      - name: Commit synchronized pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo 'Site pages are already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize site runtime across HTML pages'
          git pull --rebase origin main
          git push
